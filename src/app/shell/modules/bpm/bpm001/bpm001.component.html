<div class="page-card">
  <h2 class="page-title">კლიენტის რეგისტრაცია</h2>
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="form-field">
      <label>სახელი</label>
      <input type="text" formControlName="firstName" placeholder=""/>
      <span class="field-error" *ngIf="fn.invalid && fn.touched">{{errMsg(fn)}}</span>
    </div>
    <div class="form-field">
      <label>გვარი</label>
      <input type="text" formControlName="lastName" placeholder=""/>
      <span class="field-error" *ngIf="ln.invalid && ln.touched">{{errMsg(ln)}}</span>
    </div>
    <div class="form-field">
      <label>Plus ქულები</label>
      <input type="number" formControlName="plusPoints" min="0"/>
      <span class="field-error" *ngIf="pp.invalid && pp.touched">{{errMsg(pp)}}</span>
    </div>
    <span class="field-error" *ngIf="serverError" style="margin-bottom:8px;display:block">{{serverError}}</span>
    <button type="submit" class="btn-blue" [disabled]="loading">
      <span *ngIf="!loading">💾</span>
      <span *ngIf="loading" class="spinner"></span>
    </button>
  </form>
</div>
