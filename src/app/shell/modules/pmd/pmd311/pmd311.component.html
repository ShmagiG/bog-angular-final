<div class="page-card" style="max-width:600px">
  <h2 class="page-title">თანხის გადარიცხვა</h2>
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>

    <div class="form-field">
      <label>გამგზავნი ანგარიში</label>
      <select formControlName="senderAccountKey">
        <option value="">აირჩიეს</option>
        <option *ngFor="let a of allAccounts" [value]="a.id">
          {{a.accountName}} — {{a.balance | number:'1.2-2'}}
        </option>
      </select>
      <span class="field-error" *ngIf="sa.invalid && sa.touched">{{errMsg(sa)}}</span>
    </div>

    <div class="form-field">
      <label>მიმღები ანგარიში</label>
      <select formControlName="receiverAccountKey">
        <option value="">აირჩიეს</option>
        <option *ngFor="let a of allAccounts" [value]="a.id">
          {{a.accountName}} — {{a.balance | number:'1.2-2'}}
        </option>
      </select>
      <span class="field-error" *ngIf="ra.invalid && ra.touched">{{errMsg(ra)}}</span>
    </div>

    <div class="form-field">
      <label>თანხა</label>
      <input type="number" formControlName="amount" min="0"/>
      <span class="field-error" *ngIf="am.invalid && am.touched">{{errMsg(am)}}</span>
    </div>

    <span class="field-error" *ngIf="serverError" style="margin-bottom:8px;display:block">{{serverError}}</span>

    <button type="submit" class="btn-green" [disabled]="loading">
      <span *ngIf="!loading">✓</span><span *ngIf="loading" class="spinner"></span>
    </button>
  </form>
</div>
