<div class="page-card">
  <h2 class="page-title">კლიენტის ძებნა</h2>

  <form [formGroup]="form" (ngSubmit)="search()" novalidate>
    <div class="search-row">
      <input type="text" formControlName="firstName"    placeholder="სახელი" class="search-inp"/>
      <input type="text" formControlName="lastName"     placeholder="გვარი"  class="search-inp"/>
      <input type="text" formControlName="clientNumber" placeholder="კლიენტის უნიკალური" class="search-inp"/>
    </div>
    <div class="search-action">
      <button type="submit" class="btn-blue search-btn" [disabled]="loading">
        <span *ngIf="!loading">🔍</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </div>
  </form>
</div>

<div class="page-card results-card" *ngIf="searched || clients.length">
  <div class="segment-header">
    <span>კლიენტები</span>
    <button class="btn-add" (click)="goRegister()">+</button>
  </div>
  <table class="bog-table">
    <thead><tr><th>სახელი</th><th>გვარი</th><th>კლიენტის უნიკალური</th></tr></thead>
    <tbody>
      <tr *ngFor="let c of clients" (click)="enterClient(c)">
        <td>{{c.firstName}}</td><td>{{c.lastName}}</td><td>{{c.clientNumber ?? c.id}}</td>
      </tr>
      <tr *ngIf="!clients.length && searched">
        <td colspan="3" class="no-data">კლიენტი ვერ მოიძებნა</td>
      </tr>
    </tbody>
  </table>
</div>
