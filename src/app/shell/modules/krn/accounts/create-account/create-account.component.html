<div class="page-card" style="max-width:600px">
  <h2 class="page-title">ანგარიშის შექმნა</h2>
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="form-field">
      <label>ანგარიშის სახელი</label>
      <input type="text" formControlName="accountName"/>
      <span class="field-error" *ngIf="an.invalid && an.touched">{{errMsg(an)}}</span>
    </div>
    <div class="form-field">
      <label>თანხა</label>
      <input type="number" formControlName="balance" min="0"/>
      <span class="field-error" *ngIf="ba.invalid && ba.touched">{{errMsg(ba)}}</span>
    </div>
    <span class="field-error" *ngIf="serverError" style="margin-bottom:8px;display:block">{{serverError}}</span>
    <button type="submit" class="btn-blue" [disabled]="loading">
      <span *ngIf="!loading">💾</span><span *ngIf="loading" class="spinner"></span>
    </button>
  </form>
</div>
